<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
    <title>KJ6 – Legacy-Seite deaktiviert</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #08090d;
            --surface: rgba(18, 20, 29, 0.92);
            --surface-border: rgba(181, 146, 255, 0.26);
            --text: #f4f0ff;
            --muted: #b8b0c9;
            --accent: #c4a7ff;
            --accent-strong: #e0d2ff;
            --disabled: #9a7ed2;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 50% 0%, rgba(116, 72, 186, 0.2), transparent 42rem),
                var(--background);
        }

        .site-header,
        .site-footer {
            width: min(100% - 2rem, 72rem);
            margin-inline: auto;
        }

        .site-header {
            padding-block: 1.5rem;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        main {
            width: min(100% - 2rem, 48rem);
            margin-inline: auto;
            display: grid;
            place-items: center;
            padding-block: 3rem 5rem;
        }

        .legacy-card {
            width: 100%;
            padding: clamp(1.5rem, 5vw, 3.5rem);
            border: 1px solid var(--surface-border);
            border-radius: 1.5rem;
            background: var(--surface);
            box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, 0.38);
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin: 0 0 1.25rem;
            padding: 0.45rem 0.75rem;
            border: 1px solid rgba(196, 167, 255, 0.3);
            border-radius: 999px;
            color: var(--accent-strong);
            background: rgba(95, 62, 151, 0.18);
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status::before {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--disabled);
            content: "";
            box-shadow: 0 0 1rem rgba(154, 126, 210, 0.68);
        }

        h1 {
            max-width: 18ch;
            margin: 0 auto;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 7vw, 4.2rem);
            font-weight: 500;
            line-height: 1.06;
            letter-spacing: -0.035em;
        }

        .explanation {
            max-width: 38rem;
            margin: 1.5rem auto 0;
            color: var(--muted);
            font-size: clamp(1rem, 2.6vw, 1.12rem);
            line-height: 1.75;
        }

        .safe-routes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .safe-routes a {
            min-width: 10.5rem;
            padding: 0.78rem 1.1rem;
            border: 1px solid rgba(196, 167, 255, 0.38);
            border-radius: 0.8rem;
            color: var(--text);
            background: rgba(105, 72, 162, 0.16);
            font-weight: 700;
            line-height: 1.3;
            text-decoration: none;
        }

        .safe-routes a:hover {
            border-color: rgba(224, 210, 255, 0.72);
            background: rgba(129, 89, 198, 0.26);
        }

        .safe-routes a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 4px;
        }

        .site-footer {
            padding-block: 1.5rem 2rem;
            color: #888194;
            font-size: 0.8rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 34rem) {
            .site-header {
                padding-block: 1.1rem;
                font-size: 0.7rem;
            }

            main {
                padding-block: 1.5rem 3rem;
            }

            .legacy-card {
                border-radius: 1.1rem;
            }

            .safe-routes {
                flex-direction: column;
            }

            .safe-routes a {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">KJ6 Origin · Legacy-Containment</header>

    <main>
        <section class="legacy-card" aria-labelledby="legacy-title">
            <p class="status">Legacy · deaktiviert</p>
            <h1 id="legacy-title">Diese frühere Prototypseite ist außer Betrieb.</h1>
            <p class="explanation">
                Die frühere Operator-Funktion wurde vollständig stillgelegt. Diese Seite ist statisch und enthält nur sichere Rückwege zur KJ6-Origin-Website.
            </p>
            <nav class="safe-routes" aria-label="Sichere Rückwege">
                <a href="index.html">Zur Startseite</a>
                <a href="chronik-komplett.html">Zur Chronik</a>
            </nav>
        </section>
    </main>

    <footer class="site-footer">KJ6 · Legacy-Containment</footer>
</body>
</html>
